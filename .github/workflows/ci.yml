name: CI

"on":
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared core
        run: npm --workspace @planme/core run build

      - name: Lint
        run: npm run lint

      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web

      - name: Contract checks
        run: |
          npm run test:v3
          npm run test:finalization
          npm run test:completion
          npm run test:route-normalization
          npm --workspace @planme/web run check:search-rate-limit

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 이미지를 푸시하지 않고 Dockerfile과 standalone 빌드가 깨지지 않았는지만 검증합니다.
      - name: Build image
        run: docker build --tag planme-web:ci .
